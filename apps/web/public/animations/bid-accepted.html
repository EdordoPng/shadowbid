<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasma Martelletto Trasparente</title>
    <style>
        :root {
            --line-color: #111111;
            --ghost-fill: #ffffff;
            --stroke-width: 9px;
            --anim-duration: 2.2s;
        }

        /* Sfondo completamente trasparente */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .animation-wrapper {
            position: relative;
            width: 520px;
            max-width: 92vw;
            height: 520px;
            max-height: 92vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .line-art {
            stroke: var(--line-color);
            stroke-width: var(--stroke-width);
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ============================================================
       1. FISICA DEL CORPO: SQUASH & STRETCH
       ============================================================ */
        .ghost-body-group {
            transform-origin: 250px 380px;
            animation: ghostBodyAction var(--anim-duration) cubic-bezier(0.4, 0, 0.2, 1) 1 both;
        }

        @keyframes ghostBodyAction {

            0%,
            100% {
                transform: translateY(0) scale(1) rotate(0deg);
            }

            22% {
                /* Allungamento preparatorio mentre alza il martello */
                transform: translateY(-8px) scale(0.97, 1.03) rotate(-2deg);
            }

            34%,
            46% {
                /* Caricamento massimo a sinistra */
                transform: translateY(-12px) scale(0.96, 1.04) rotate(-3deg);
            }

            50% {
                /* Inizio discesa fulminea */
                transform: translateY(-2px) scale(0.99, 1.01) rotate(-1deg);
            }

            53% {
                /* IMPATTO: schiacciamento elastico sul colpo */
                transform: translateY(16px) scale(1.08, 0.91) rotate(2deg);
            }

            59% {
                /* Rimbalzo post-battuta */
                transform: translateY(-5px) scale(0.98, 1.02) rotate(-0.5deg);
            }

            68% {
                transform: translateY(2px) scale(1.01, 0.99) rotate(0.5deg);
            }

            82% {
                transform: translateY(0) scale(1) rotate(0deg);
            }
        }

        /* ============================================================
       2. TRAIETTORIA BRACCIO E MARTELLO
       (Dall'alto a sinistra giù verso il basso a destra con battuta)
       ============================================================ */
        .hammer-rig {
            transform-origin: 225px 275px;
            animation: hammerSwing var(--anim-duration) cubic-bezier(0.35, 0, 0.25, 1) 1 both;
        }

        @keyframes hammerSwing {

            0%,
            100% {
                /* Posa di riposo / battuta completata */
                transform: rotate(58deg) translate(8px, 14px);
            }

            16% {
                /* Inizia la salita verso sinistra */
                transform: rotate(15deg) translate(0px, 0px);
            }

            32% {
                /* APICE: martello alto a sinistra della testa (Frame 00:02) */
                transform: rotate(-38deg) translate(-8px, -22px);
            }

            38% {
                /* Vibrazione d'attesa/tensione a mezz'aria */
                transform: rotate(-43deg) translate(-10px, -26px);
            }

            43% {
                transform: rotate(-37deg) translate(-7px, -20px);
            }

            47% {
                transform: rotate(-43deg) translate(-10px, -26px);
            }

            51% {
                /* Transizione rapida di calata */
                transform: rotate(10deg) translate(0px, 0px);
            }

            53% {
                /* COLPO / SLAM a terra (Frame 00:04 & 00:08) */
                transform: rotate(78deg) translate(14px, 22px);
            }

            58% {
                /* Rimbalzo del martello dal tavolo */
                transform: rotate(64deg) translate(9px, 15px);
            }

            66% {
                transform: rotate(70deg) translate(11px, 18px);
            }

            82% {
                transform: rotate(60deg) translate(8px, 14px);
            }
        }

        /* ============================================================
       3. REAZIONE OCCHI (Aperti -> Strizzati all'impatto)
       ============================================================ */
        .eyes-open {
            animation: eyesBlinkAnim var(--anim-duration) step-end 1 both;
        }

        .eyes-squint {
            opacity: 0;
            animation: eyesSquintAnim var(--anim-duration) step-end 1 both;
        }

        @keyframes eyesBlinkAnim {

            0%,
            51% {
                opacity: 1;
            }

            52%,
            62% {
                opacity: 0;
            }

            63%,
            100% {
                opacity: 1;
            }
        }

        @keyframes eyesSquintAnim {

            0%,
            51% {
                opacity: 0;
            }

            52%,
            62% {
                opacity: 1;
            }

            63%,
            100% {
                opacity: 0;
            }
        }

        /* ============================================================
       4. LINEE CINETICHE DI DISCESA (SWOOSH SULLA TESTA)
       ============================================================ */
        .motion-lines {
            opacity: 0;
            transform-origin: 250px 140px;
            animation: swooshAnim var(--anim-duration) ease-out 1 both;
        }

        @keyframes swooshAnim {

            0%,
            48% {
                opacity: 0;
                transform: scale(0.9) rotate(-8deg);
            }

            50% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }

            53% {
                opacity: 0.8;
                transform: scale(1.04) rotate(4deg);
            }

            54%,
            100% {
                opacity: 0;
            }
        }

        /* ============================================================
       5. EFFETTO URTO & POLVERE (PARTICELLE LATERALI)
       ============================================================ */
        .impact-particles {
            transform-origin: 370px 370px;
            opacity: 0;
            animation: impactBurst var(--anim-duration) ease-out 1 both;
        }

        @keyframes impactBurst {

            0%,
            52% {
                opacity: 0;
                transform: scale(0.6);
            }

            53% {
                opacity: 1;
                transform: scale(1.1);
            }

            60% {
                opacity: 0.6;
                transform: scale(1.3);
            }

            64%,
            100% {
                opacity: 0;
                transform: scale(1.4);
            }
        }

        /* Vibrazione di carica in alto a sinistra */
        .vibe-lines {
            opacity: 0;
            animation: vibeAnim var(--anim-duration) step-end 1 both;
        }

        @keyframes vibeAnim {

            0%,
            34% {
                opacity: 0;
            }

            35%,
            48% {
                opacity: 1;
            }

            49%,
            100% {
                opacity: 0;
            }
        }

    </style>
</head>

<body>

    <div class="animation-wrapper">
        <svg viewBox="0 0 500 500">
            <g class="motion-lines line-art" stroke-width="6" fill="none">
                <path d="M 215 92 C 248 82 292 98 322 138" />
                <path d="M 230 70 C 268 62 318 78 350 118" />
            </g>

            <g class="vibe-lines line-art" stroke-width="5" fill="none">
                <line x1="120" y1="120" x2="105" y2="110" />
                <line x1="112" y1="138" x2="95" y2="136" />
                <line x1="118" y1="156" x2="102" y2="162" />
            </g>

            <g class="ghost-body-group">

                <path class="line-art" fill="var(--ghost-fill)" d="M 175 140
                 C 175 75 210 55 250 55
                 C 290 55 325 75 325 140
                 C 325 210 345 285 385 355
                 C 380 375 360 382 345 368
                 C 325 352 312 395 285 395
                 C 260 395 246 364 225 364
                 C 205 364 190 385 170 380
                 C 148 375 120 386 125 360
                 C 130 328 155 245 175 140 Z" />

                <path class="line-art" fill="none" stroke-width="8" d="M 144 368 C 160 360 174 348 186 332" />

                <g class="eyes-open" fill="var(--line-color)">
                    <ellipse cx="222" cy="168" rx="10" ry="16" />
                    <ellipse cx="276" cy="168" rx="10" ry="16" />
                </g>

                <g class="eyes-squint line-art" fill="none" stroke-width="8">
                    <path d="M 212 168 Q 222 160 232 168" />
                    <path d="M 266 168 Q 276 160 286 168" />
                </g>

                <path class="line-art" fill="none" stroke-width="7" d="M 238 198 Q 250 208 264 198" />

                <g class="hammer-rig">
                    <path class="line-art" fill="var(--ghost-fill)" d="M 198 276
                   C 192 245 204 222 220 202
                   C 232 202 242 222 238 252 Z" />

                    <rect class="line-art" fill="var(--ghost-fill)" x="218" y="85" width="14" height="150" rx="7" />

                    <g>
                        <rect class="line-art" fill="var(--ghost-fill)" x="198" y="90" width="54" height="48" rx="6" />
                        <rect class="line-art" fill="var(--ghost-fill)" x="190" y="84" width="12" height="60" rx="4" />
                        <rect class="line-art" fill="var(--ghost-fill)" x="248" y="84" width="12" height="60" rx="4" />
                    </g>

                    <circle class="line-art" fill="var(--ghost-fill)" cx="225" cy="204" r="16" />
                    <path class="line-art" fill="none" stroke-width="6" d="M 218 200 Q 225 192 232 198" />
                </g>
            </g>

            <g class="impact-particles line-art" stroke-width="5" fill="var(--line-color)">
                <circle cx="390" cy="355" r="4" />
                <circle cx="410" cy="375" r="5" />
                <circle cx="395" cy="400" r="4" />
                <line x1="375" y1="380" x2="405" y2="385" stroke-width="6" />
                <line x1="365" y1="395" x2="385" y2="415" stroke-width="6" />
            </g>

        </svg>
    </div>

</body>

</html>
